# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version
    rev: v0.6.0
    hooks:
      # Run the linter.
      - id: ruff
        name: Lint with ruff
        types_or: [python, pyi]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        name: Format with ruff-format
        types_or: [python, pyi]
